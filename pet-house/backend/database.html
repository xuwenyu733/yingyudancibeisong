<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宠物小屋 · 数据库目录</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#273b35;font:15px/1.6 system-ui}header{padding:25px 32px;background:#224c40;color:#fff}h1{margin:0;font-size:26px}header p{margin:6px 0;color:#d7e8df}header a{color:#fff}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;padding:20px}aside,section{background:#fff;border:1px solid #dce4db;border-radius:16px;padding:18px;min-width:0}aside{max-height:calc(100vh - 180px);overflow:auto}h2{font-size:19px;margin:0 0 8px}h3{margin:20px 0 7px;font-size:14px;color:#63776e}button,input,select{font:inherit;border-radius:8px;border:1px solid #c9d7ca;padding:8px;background:white;color:inherit}aside button{display:block;width:100%;text-align:left;margin:6px 0;font-size:13px}button{cursor:pointer}aside button[aria-current=true]{background:#e4f0e5;border-color:#659a75}small{display:block;color:#718078;font-size:12px}input{width:100%}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.tools label{flex:1;min-width:200px}.tools input,.tools select{display:block;width:100%}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #dce4dd;padding:9px;text-align:left;vertical-align:top;white-space:nowrap}th{background:#eef4ed;position:sticky;top:0}td.long{white-space:normal;min-width:250px;max-width:450px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;font:12px/1.5 monospace}#message{color:#6b786f}.empty{padding:40px;text-align:center;color:#7c8881}.badge{display:inline-block;background:#e3ede4;border-radius:7px;padding:2px 8px;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}aside{max-height:250px}header{padding:20px}}</style>
<header><h1>宠物小屋 · 数据库目录</h1><p>pet_room · 按业务分区 · 每个字段都有中文说明 · 本机只读查看</p><a href="/?storage=mysql">← 回到小屋</a></header>
<main><aside><label>查找数据表或字段<input id="search" placeholder="输入：积分、楼层、昵称、家具…"></label><div id="nav"></div></aside><section><h2 id="title">正在连接数据库…</h2><p id="description"></p><div class="tools"><label>存档空间<select id="account"><option value="">所有空间</option></select></label><label>楼层<select id="room"><option value="">所有楼层</option></select></label><label>筛选当前结果<input id="rowSearch" placeholder="输入房间名、SKU、事件编号…"></label><button id="refresh">刷新</button></div><p id="message" role="status"></p><div class="scroll" id="result"></div></section></main>
<script type="module">
const $=id=>document.getElementById(id),groups={新手:'直接点中文入口',v:'常用中文查询视图',social:'联网账号与朋友',usr:'用户与设置',room:'楼层与装修',inv:'家具产权与仓库',pet:'宠物与礼物',wallet:'共享积分与回执',learn:'原有学习与纪念书',cfg:'商品与成就目录',sys:'存档与系统'};let schema,table,rows=[],request=0,roomRequest=0;
const node=(tag,text,parent)=>{const el=document.createElement(tag);el.textContent=text??'';parent?.append(el);return el;};
async function get(url){const response=await fetch(url,{cache:'no-store'}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||'读取失败');return data;}
function nav(){const term=$('search').value.trim().toLowerCase();$('nav').replaceChildren();for(const[prefix,label]of Object.entries(groups)){const tables=schema.tables.filter(t=>t.table_name.startsWith(prefix+'_')&&(!term||[t.table_name,t.table_comment,...schema.columns.filter(c=>c.table_name===t.table_name).map(c=>c.column_name+' '+c.column_comment)].join(' ').toLowerCase().includes(term)));if(!tables.length)continue;node('h3',label,$('nav'));for(const t of tables){const b=node('button',t.table_name.startsWith('新手_')?t.table_name.replace(/^新手_\d+_/,''):t.table_comment&&t.table_comment!=='VIEW'?t.table_comment:t.table_name,$('nav'));if(!t.table_name.startsWith('新手_'))node('small',t.table_name,b);b.setAttribute('aria-current',String(table===t.table_name));b.onclick=()=>load(t.table_name);}}}
function render(){const term=$('rowSearch').value.trim().toLowerCase(),visible=rows.filter(row=>!term||JSON.stringify(row).toLowerCase().includes(term));$('result').replaceChildren();if(!visible.length){node('p','当前没有匹配记录；打开小屋后会自动保存实际存档。',$('result')).className='empty';return;}const t=node('table','',$('result')),head=node('tr','',node('thead','',t)),keys=Object.keys(visible[0]);for(const key of keys){const th=node('th',key,head),col=schema.columns.find(c=>c.table_name===table&&c.column_name===key);if(col?.column_comment)node('small',col.column_comment,th);}
const body=node('tbody','',t);for(const row of visible){const tr=node('tr','',body);for(const key of keys){const td=node('td','',tr),value=row[key],text=value===null?'—':typeof value==='object'?JSON.stringify(value,null,2):String(value);if(text.length>140){td.className='long';const d=node('details','',td);node('summary',`${text.slice(0,85)}…（展开）`,d);node('pre',text,d);}else td.textContent=text;}}$('message').textContent=`显示 ${visible.length} 行 / 本次读取 ${rows.length} 行；每次最多100行。时间字段说明中的 UTC 为统一存储时区。`;}
async function load(name=table){if(!name)return;const serial=++request;table=name;nav();const meta=schema.tables.find(t=>t.table_name===name);$('title').textContent=name.replace(/^新手_\d+_/,'');$('description').textContent=meta?.table_comment==='VIEW'?'选择账号和楼层即可查看。这里只展示信息，装修和读取存档请在小屋中操作。':meta?.table_comment||'';$('message').textContent='正在读取…';const roomColumn=schema.columns.some(column=>column.table_name===name&&['room_id','楼层编号'].includes(column.column_name));$('room').disabled=!$('account').value||!roomColumn;const params=new URLSearchParams({table:name,namespace:$('account').value});if(!$('room').disabled&&$('room').value)params.set('room_id',$('room').value);try{const data=await get('/api/v1/rows?'+params);if(serial!==request)return;rows=data.rows;render();}catch(error){$('message').textContent=error.message;}}
async function loadRooms(){const serial=++roomRequest;$('room').replaceChildren();node('option','所有楼层',$('room')).value='';if($('account').value){try{const data=await get('/api/v1/rows?'+new URLSearchParams({table:'room_floors',namespace:$('account').value}));if(serial!==roomRequest)return;for(const room of data.rows)node('option',`${room.floor_no} 楼 · ${room.room_name}`,$('room')).value=room.room_id;}catch(error){$('message').textContent=error.message;}}await load();}
$('search').oninput=nav;$('rowSearch').oninput=render;$('refresh').onclick=()=>load();$('account').onchange=loadRooms;$('room').onchange=()=>load();
try{schema=await get('/api/v1/schema');const friendly=schema.tables.some(t=>t.table_name==='新手_01_账号总览');const data=await get('/api/v1/rows?'+new URLSearchParams({table:friendly?'新手_01_账号总览':'sys_save_slots'}));for(const row of data.rows){const o=node('option',friendly?row['账号名称']:row.namespace,$('account'));o.value=friendly?row['账号编号']:row.namespace;}nav();const requested=new URLSearchParams(location.search).get('table');await load(schema.tables.some(t=>t.table_name===requested)?requested:friendly?'新手_00_使用指南':'v_account_overview');}catch(error){$('title').textContent='数据库暂时无法读取';$('message').textContent=error.message;}
</script></html>
